name: pemonline
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PEM_KEYCLOAK_ADMIN_PASSWORD:?Bitte zuerst Keycloak.ps1 ausfuehren.}
      PEM_KEYCLOAK_APP_PASSWORD: ${PEM_KEYCLOAK_APP_PASSWORD:?Bitte zuerst Keycloak.ps1 ausfuehren.}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/pemonline-realm.json:/opt/keycloak/data/import/pemonline-realm.json:ro
    restart: unless-stopped
volumes:
  keycloak-data:
