spring.application.name=pemonline
spring.jackson.deserialization.accept-float-as-int=false
debug=false
server.address=127.0.0.1
server.port=${PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.use-last-modified=false

spring.datasource.url=${MITARBEITER_DB_URL:jdbc:h2:file:${mitarbeiter.datenverzeichnis}/mitarbeiter}
spring.datasource.username=${MITARBEITER_DB_USER:sa}
spring.datasource.password=${MITARBEITER_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.sql.init.mode=never

mitarbeiter.datenverzeichnis=${MITARBEITER_DATENVERZEICHNIS:${LOCALAPPDATA:${user.home}}/pemonline}
logging.file.name=${mitarbeiter.datenverzeichnis}/logs/pemonline.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=INFO
logging.level.org.springframework=INFO

# Optionaler HTTP-Empfänger für Ereignisse; leer bedeutet ausgeschaltet.
mitarbeiter.externer-dienst-url=${MITARBEITER_DIENST_URL:}
mitarbeiter.outbox.automatisch=true
mitarbeiter.outbox.intervall-ms=1000

# Nur zur einmaligen Anlage, wenn noch kein Konto existiert.
mitarbeiter.admin-name=${MITARBEITER_ADMIN_NAME:admin}
mitarbeiter.admin-passwort=${MITARBEITER_ADMIN_PASSWORT:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MITARBEITER_HTTPS:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Größenfehler bis zur Request-Grenze beantworten, ohne die Verbindung vorzeitig zu schließen.
server.tomcat.max-swallow-size=6MB

# OIDC Authorization Code mit PKCE; Tokens bleiben auf dem Server.
pem.anmeldung=${PEM_ANMELDUNG:keycloak}
pem.keycloak.issuer=${PEM_KEYCLOAK_ISSUER:http://127.0.0.1:8180/realms/pemonline}
pem.keycloak.client-id=${PEM_KEYCLOAK_CLIENT_ID:pemonline}
# Leer fuer den mitgelieferten oeffentlichen PKCE-Client; bei vertraulichen Clients setzen.
pem.keycloak.client-secret=${PEM_KEYCLOAK_CLIENT_SECRET:}

# Konto-E-Mails werden erst nach ausdrücklicher Konfiguration aktiviert.
pem.konto-mail.aktiv=${PEM_KONTO_MAIL_AKTIV:false}
pem.konto-mail.absender=${PEM_MAIL_ABSENDER:}
pem.konto-mail.basis-url=${PEM_BASIS_URL:}
spring.mail.host=${PEM_SMTP_HOST:}
spring.mail.port=${PEM_SMTP_PORT:587}
spring.mail.username=${PEM_SMTP_BENUTZER:}
spring.mail.password=${PEM_SMTP_PASSWORT:}
spring.mail.properties.mail.smtp.auth=${PEM_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${PEM_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${PEM_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
